apiVersion: v1
kind: ConfigMap
metadata:
  name: router-config
data:
  MOCK_TIERS: "true"
  OLLAMA_URL: "http://host.docker.internal:11434"
  OLLAMA_MODEL: "llama3.2:3b"
  CLASSIFIER: "rules"
  CACHE_TTL_SECONDS: "3600"
  CACHE_SCHEMA_VERSION: "v1"
  MAX_TOKENS: "1024"
  SONNET_THINKING: "adaptive"
  RATE_LIMIT_PER_MINUTE: "120"
  LOG_LEVEL: "INFO"
---
# Secrets are never committed. This ships empty and is filled at apply time
# from .env by `make k8s-secret`, which copies ONLY the two secret keys.
#
# Do not use --from-env-file=.env here: it loads every line of .env into the
# Secret, and because secretRef is listed after configMapRef in the pod spec,
# any overlapping key silently overrides the ConfigMap. MOCK_TIERS=false in a
# developer's .env would quietly put the whole cluster into live mode.
apiVersion: v1
kind: Secret
metadata:
  name: router-secrets
type: Opaque
stringData:
  ANTHROPIC_API_KEY: ""
  GATEWAY_API_KEYS: ""
