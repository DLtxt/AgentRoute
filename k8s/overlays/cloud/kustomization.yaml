apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - loadbalancer.yaml

# Cloud nodes cannot see a local Docker daemon, so images come from a registry
# rather than `kind load`. Replace OWNER with your GitHub account, lowercased --
# Docker rejects uppercase repository names.
images:
  - name: ai-router-gateway
    newName: ghcr.io/OWNER/ai-router
    newTag: latest
  - name: ai-router-balancer
    newName: ghcr.io/OWNER/ai-router
    newTag: latest

patches:
  # Cloud nodes have no host Ollama to reach. Mock mode keeps the local tier
  # answering without one; point OLLAMA_URL at an in-cluster Ollama instead if
  # you want the real thing, and expect it to be slow on a small node.
  - target: {kind: ConfigMap, name: router-config}
    patch: |
      - op: replace
        path: /data/MOCK_TIERS
        value: "true"
