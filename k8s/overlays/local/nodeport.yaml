# Local-only entry point. kind maps host port 8000 to node port 30080, so the
# same curl commands work against the cluster as against Compose. A cloud
# overlay would swap this for a LoadBalancer Service; nothing else changes.
apiVersion: v1
kind: Service
metadata:
  name: balancer-nodeport
spec:
  type: NodePort
  selector: {app: balancer}
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
