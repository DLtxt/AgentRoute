name: CI

# No repository secrets are configured or needed. Everything below runs in mock
# mode, which is why the portability contract insisted on building mock mode
# first: a pipeline that needs an API key cannot run on a fork or a pull request
# from one. GHCR publishing uses the automatic GITHUB_TOKEN, not a stored key.
on:
  push:
    branches: [main]
  pull_request:

env:
  MOCK_TIERS: "true"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests load

      - name: Format check
        run: ruff format --check app tests load

      - name: Test
        run: pytest -q

  smoke:
    # Proves the composed system actually answers, not just that units pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the balancer to find every replica
        run: |
          for i in $(seq 1 60); do
            n=$(curl -s localhost:8000/readyz | python3 -c \
              'import json,sys; print(json.load(sys.stdin).get("available_replicas",0))' 2>/dev/null || echo 0)
            [ "$n" = "3" ] && exit 0
            sleep 2
          done
          echo "balancer never reported 3 replicas"; docker compose logs; exit 1

      - name: A request routes and answers
        run: |
          curl -sf -X POST localhost:8000/query \
            -H 'content-type: application/json' \
            -d '{"prompt":"What is the capital of France?"}' | tee /tmp/r.json
          python3 -c "import json; d=json.load(open('/tmp/r.json')); assert d['tier']=='local', d"

      - name: The second identical request is a cache hit
        run: |
          curl -sf -X POST localhost:8000/query \
            -H 'content-type: application/json' \
            -d '{"prompt":"What is the capital of France?"}' | tee /tmp/r2.json
          python3 -c "import json; d=json.load(open('/tmp/r2.json')); assert d['cached'] is True, d"

      - name: A denied capability is refused before any model call
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/query \
            -H 'content-type: application/json' \
            -d '{"prompt":"who is Ada Lovelace?","capabilities":["file_access"]}')
          [ "$code" = "403" ] || { echo "expected 403, got $code"; exit 1; }

      - name: Killing a replica drops no requests
        run: |
          pip install httpx
          python load/driver.py --duration 15 --concurrency 10 > /tmp/load.out 2>&1 &
          sleep 5 && docker stop ai-router-gateway-2
          wait
          cat /tmp/load.out
          grep -q '^failed      0$' /tmp/load.out || { echo "requests were dropped"; exit 1; }

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

  image:
    needs: [lint-and-test, smoke]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch because the images are built on x86 CI but developed on
      # Apple Silicon. Skipping this is how you get `exec format error` on a
      # cloud node with no obvious explanation.
      - name: Build and push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
