# Three nodes so scheduling has somewhere to place pods. They are containers on
# one Docker host sharing its RAM, so this gives real scheduling semantics, not
# real capacity.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ai-router
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Host 8000 reaches the balancer, matching the Compose setup so the same
      # curl commands work against either.
      - containerPort: 30080
        hostPort: 8000
        protocol: TCP
  - role: worker
  - role: worker
