[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The corpus is a data file of natural-language prompts. Wrapping them to fit a
# line limit would make the dataset harder to read and edit, and the prompts'
# length is itself part of what the classifier learns from.
"app/classifier/corpus.py" = ["E501"]
