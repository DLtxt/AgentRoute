services:
  redis:
    image: redis:7-alpine
    # No persistence: this is a cache and a scaling signal, not a datastore.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # Optional containerized Ollama, for Linux and CI.
  #   docker compose --profile with-ollama up -d
  #   OLLAMA_URL=http://ollama:11434
  #
  # Not the default on macOS: Docker Desktop gives containers no Metal access,
  # so a containerized Ollama runs on CPU and is far slower than the host
  # install. The local tier is supposed to be the fast one.
  ollama:
    image: ollama/ollama:latest
    profiles: ["with-ollama"]
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 6G

  # Entry point. The gateway deliberately publishes no host port -- only the
  # balancer does, or `--scale gateway=3` would collide on it.
  balancer:
    build: .
    command: ["uvicorn", "app.load_balancer:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8000:8080"
    environment:
      GATEWAY_HOST: "gateway"
      GATEWAY_PORT: "8000"
      LB_STRATEGY: "${LB_STRATEGY:-least_connections}"
      LB_FAILURE_THRESHOLD: "${LB_FAILURE_THRESHOLD:-3}"
      LB_COOLDOWN_SECONDS: "${LB_COOLDOWN_SECONDS:-30}"
      LB_HEALTH_INTERVAL_SECONDS: "${LB_HEALTH_INTERVAL_SECONDS:-2}"
      LB_UPSTREAM_TIMEOUT_SECONDS: "${LB_UPSTREAM_TIMEOUT_SECONDS:-120}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    depends_on:
      - gateway
    deploy:
      resources:
        limits:
          memory: 256M

  gateway:
    build: .
    # Three replicas by default, so `docker compose up -d` gives the balancer
    # something to balance without a --scale flag. Passing --scale gateway=N
    # still overrides this; omitting it no longer silently drops back to one.
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 512M
    environment:
      MOCK_TIERS: "${MOCK_TIERS:-true}"
      REDIS_URL: "redis://redis:6379/0"
      OLLAMA_URL: "${OLLAMA_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.2:3b}"
      OLLAMA_TIMEOUT_SECONDS: "${OLLAMA_TIMEOUT_SECONDS:-120}"
      CACHE_TTL_SECONDS: "${CACHE_TTL_SECONDS:-3600}"
      CACHE_SCHEMA_VERSION: "${CACHE_SCHEMA_VERSION:-v1}"
      CLASSIFIER: "${CLASSIFIER:-rules}"
      MAX_TOKENS: "${MAX_TOKENS:-1024}"
      SONNET_THINKING: "${SONNET_THINKING:-adaptive}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    # Lets the container reach a host-run Ollama on Linux too; Docker Desktop
    # provides host.docker.internal natively.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  ollama-models:
