services:
  redis:
    image: redis:7-alpine
    # No persistence: this is a cache and a scaling signal, not a datastore.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  gateway:
    build: .
    # Ring 0 has no load balancer, so the gateway is the entry point and
    # publishes a host port. Phase 2 removes this block: once the balancer
    # fronts N replicas, only the balancer may publish, or `--scale gateway=3`
    # collides on the port.
    ports:
      - "8000:8000"
    environment:
      MOCK_TIERS: "${MOCK_TIERS:-true}"
      REDIS_URL: "redis://redis:6379/0"
      OLLAMA_URL: "${OLLAMA_URL:-http://host.docker.internal:11434}"
      CACHE_TTL_SECONDS: "${CACHE_TTL_SECONDS:-3600}"
      CACHE_SCHEMA_VERSION: "${CACHE_SCHEMA_VERSION:-v1}"
      CLASSIFIER: "${CLASSIFIER:-rules}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
